# CI for every push and pull request: build with warnings as errors, formatting, and all tests
# (including the architecture tests: backend SD1/SD2, app import rules; ADR 0001 and 0019),
# plus the API v1 contract (ADR 0017): snapshot, backward compatibility, generated Dart client,
# and the database: schema and role per module (SD4, ADR 0004), OSM import.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Memorio.slnx
      - run: dotnet build Memorio.slnx --no-restore --configuration Release
      - run: dotnet format Memorio.slnx --verify-no-changes --no-restore
      # Includes OpenApiContractTests: api/openapi.v1.json must equal what the API serves.
      - run: dotnet test --solution Memorio.slnx --no-build --configuration Release

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RD2: the same image goes to every environment.
      - run: docker build -t memorio-api:${{ github.sha }} .
      - name: Starts with the required configuration and answers /health
        run: |
          docker run -d --name api -p 8080:8080 -e AppVersion__Minimum=0.1.0 memorio-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Refuses to start without it
        run: |
          if docker run --rm memorio-api:${{ github.sha }}; then echo "started without AppVersion__Minimum"; exit 1; fi

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Schema-per-module rights (SD4) are tested in the backend job (Memorio.Database.Tests); this job
      # checks the local Compose database and the OSM import on the synthetic sample.
      - run: docker compose up -d --wait postgres
      - name: OSM import loads the places of the sample, owned by the Places module only
        run: |
          docker compose --profile tools run --rm --build osm-import /samples/sample.osm
          docker compose --profile tools run --rm --build osm-import /samples/sample.osm   # replaces, does not add
          psql() { docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U memorio_admin -d memorio -tAc "$1"; }
          test "$(psql "SELECT string_agg(name, ',' ORDER BY osm_id) FROM places.osm_places")" = "Sample Village,Sample Viewpoint,Sample Lake"
          test "$(psql "SELECT count(*) FROM pg_tables WHERE schemaname = 'places' AND tableowner <> 'memorio_places'")" = "0"
          test "$(psql "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename <> 'spatial_ref_sys'")" = "0"
          if psql "SET ROLE memorio_album; SELECT 1 FROM places.osm_places LIMIT 1"; then echo "another module reads places.osm_places"; exit 1; fi
      - run: bash tools/db-bootstrap.sh   # applies again without errors

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API v1 stays backward compatible
        run: bash tools/check-api-breaking.sh "$BASE_REF"
        env:
          # Pull request: its target branch. Push to version/0.1: the previous commit. Other pushes: version/0.1.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref == 'refs/heads/version/0.1' && 'HEAD^' || 'origin/version/0.1') }}

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - name: Generated code (API client, Drift, JSON) is up to date
        run: |
          bash ../tools/generate-app-code.sh
          git diff --exit-code -- lib
          test -z "$(git status --porcelain -- lib)"
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
