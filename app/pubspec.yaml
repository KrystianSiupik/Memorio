name: memorio
description: "Memorio: shared memories and albums on a map (iOS, Android, web)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dio: 5.11.1
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  json_annotation: 4.12.0
  package_info_plus: 10.2.2
  retrofit: 4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.17.1
  flutter_lints: 6.0.0
  json_serializable: 6.15.2
  retrofit_generator: 10.3.2
  swagger_parser: 1.45.0

flutter:
  uses-material-design: true
