# Local development services (MEM-E0-PLAT-03, -02, -04, -10). Not used in deployed environments.
#   docker compose up -d --wait postgres                         # PostgreSQL + PostGIS, bootstrapped
#   docker compose run --rm osm-import /data/<extract.osm.pbf>   # OSM import from ./osm (see README)
#   docker compose up -d --wait garage && docker compose run --rm storage-bootstrap   # media bucket
#   docker compose --profile app up -d --build                  # API (:8080) and worker (:8081) on it
#   docker compose --profile app --profile monitoring up -d     # + Grafana (:3000), Prometheus (:9090), Alertmanager (:9093)
x-storage: &storage
  # Local Garage only (tools/storage/garage.toml): fixed, public test credentials, never real data.
  S3_BUCKET: memorio-media
  AWS_ACCESS_KEY_ID: GK6d656d6f72696f2d6c6f63616c6b6579
  AWS_SECRET_ACCESS_KEY: 6d656d6f72696f2d6c6f63616c2d6761726167652d7365637265742d6b657921
  AWS_DEFAULT_REGION: garage

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: memorio
      POSTGRES_USER: memorio_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorio_local}
    ports:
      # POSTGRES_PORT when 5432 is taken or reserved on the host (Windows reserves some ranges).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Runs once, when the data volume is created; tools/db-bootstrap.sh applies it again later.
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/20-bootstrap.sql:ro
      - ./db/local-passwords.sql:/docker-entrypoint-initdb.d/30-local-passwords.sql:ro
      - postgres-data:/var/lib/postgresql
    # Over TCP: during first-start initialization the server listens only on its socket.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U memorio_admin -d memorio"]
      interval: 2s
      timeout: 5s
      retries: 30

  osm-import:
    build: tools/osm-import
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: memorio
      PGUSER: memorio_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:-memorio_local}
    volumes:
      - ./osm:/data:ro
      - ./tools/osm-import/sample.osm:/samples/sample.osm:ro

  # Object storage (ADR 0005): S3-compatible, private bucket memorio-media with the upload zone.
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK6d656d6f72696f2d6c6f63616c6b6579
      GARAGE_DEFAULT_SECRET_KEY: 6d656d6f72696f2d6c6f63616c2d6761726167652d7365637265742d6b657921
      GARAGE_DEFAULT_BUCKET: memorio-media
    ports:
      - "127.0.0.1:${STORAGE_PORT:-3900}:3900"
    volumes:
      - ./tools/storage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

  storage-bootstrap:
    image: amazon/aws-cli:2.37.11
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ["bash", "/storage/bootstrap.sh"]
    environment:
      <<: *storage
      S3_ENDPOINT: http://garage:3900
    volumes:
      - ./tools/storage:/storage:ro

  api:
    build: { context: ., target: api }
    image: memorio-api:local
    profiles: [app]
    depends_on: &app-dependencies
      postgres:
        condition: service_healthy
      storage-bootstrap:
        condition: service_completed_successfully
    environment:
      AppVersion__Minimum: 0.1.0
      Messaging__ConnectionString: &messaging Host=postgres;Database=memorio;Username=memorio_messaging;Password=memorio_local
      Account__ConnectionString: &account Host=postgres;Database=memorio;Username=memorio_account;Password=memorio_local
      # Telemetry goes to the collector of the monitoring profile; without it nothing is lost but metrics and logs.
      Telemetry__OtlpEndpoint: &otlp http://otel-collector:4318
      Telemetry__Environment: &environment local
      <<: &app-storage
        Storage__Endpoint: http://garage:3900
        Storage__PublicEndpoint: http://localhost:${STORAGE_PORT:-3900}
        Storage__Region: garage
        Storage__Bucket: memorio-media
        Storage__AccessKey: GK6d656d6f72696f2d6c6f63616c6b6579
        Storage__SecretKey: 6d656d6f72696f2d6c6f63616c2d6761726167652d7365637265742d6b657921
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  worker:
    build: { context: ., target: worker }
    image: memorio-worker:local
    profiles: [app]
    depends_on: *app-dependencies
    environment:
      Messaging__ConnectionString: *messaging
      Account__ConnectionString: *account
      Scheduling__ConnectionString: Host=postgres;Database=memorio;Username=memorio_scheduler;Password=memorio_local
      Telemetry__OtlpEndpoint: *otlp
      Telemetry__Environment: *environment
      <<: *app-storage
    ports:
      - "127.0.0.1:${WORKER_PORT:-8081}:8080"

  # Observability (ADR 0014, MEM-E0-PLAT-10): locally and on test environments everything on one host;
  # in production the collector and node exporter stay on the application server and the rest runs on
  # the separate monitoring server (D-038, D-160).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: [monitoring]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      LOKI_OTLP_ENDPOINT: http://loki:3100/otlp
    ports:
      - "127.0.0.1:4318:4318"   # for an API or worker run with dotnet run
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/prometheus/targets/local:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    profiles: [monitoring]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [monitoring]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/webhook-url.local:/etc/alertmanager/secrets/webhook-url:ro

  loki:
    image: grafana/loki:3.7.8
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-memorio_local}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  garage-data:
  prometheus-data:
  loki-data:
  grafana-data:
