# Alerts of Memorio (ADR 0014, MEM-E0-PLAT-10), tested by monitoring/prometheus/tests/memorio.test.yml.
# Delay from an event to an alert: backlog sampled every 15 s, exported every 60 s, scraped every 30 s,
# rules evaluated every 30 s, so at most about 2.5 min plus the rule's "for" (QS12: detection within 5 min).
groups:
  - name: availability
    rules:
      - alert: MemorioDown
        expr: probe_success{job="health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} does not answer (external probe)."

      - alert: MemorioNotReady
        expr: probe_success{job="ready"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not ready: a dependency (database, bucket, scheduler) fails."

      - alert: TelemetryMissing
        expr: up{job="collector"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No metrics from the application: the OpenTelemetry Collector cannot be scraped."

      - alert: HighServerErrorRate
        expr: >
          sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            / sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }}: more than 5% of requests end with a server error."

      - alert: DiskAlmostFull
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }}: less than 10% of the disk is free."

  - name: storage
    rules:
      # SD5 (ADR 0005): the media bucket answered an anonymous read; at once, it is a data leak.
      - alert: MediaBucketNotPrivate
        expr: probe_success{job="bucket-private"} == 0 and on (instance) probe_http_status_code{job="bucket-private"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Anonymous {{ $labels.instance }} was not refused: the media bucket is not private."

  # Backups of the stage 1 server (QS2: RPO ≤ 15 min, SD13: monthly restore test), from the metrics the
  # operation scripts of deploy/backup write for the node exporter.
  - name: backups
    rules:
      - alert: WalArchiveStale
        expr: time() - max(memorio_wal_archived_last_timestamp_seconds) > 900
        labels:
          severity: critical
        annotations:
          summary: "No WAL segment archived for more than 15 minutes: a crash now would lose more than the RPO allows."

      - alert: WalArchiveFailing
        expr: increase(memorio_wal_archive_failed_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "WAL archiving to the backup bucket failed in the last 15 minutes."

      - alert: BackupOverdue
        expr: time() - max(memorio_backup_last_success_timestamp_seconds) > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: "No base backup for more than 26 hours."

      - alert: RestoreTestOverdue
        expr: time() - max(memorio_restore_test_last_success_timestamp_seconds) > 35 * 86400
        labels:
          severity: warning
        annotations:
          summary: "No passed restore test for more than 35 days (SD13: monthly)."

  - name: messaging
    rules:
      # QS12: an outbox (or queue, inbox) message older than 10 minutes is an alert.
      - alert: MessageBacklogTooOld
        expr: max by (stage) (memorio_messaging_pending_oldest_age_seconds) > 600
        labels:
          severity: critical
        annotations:
          summary: "The oldest {{ $labels.stage }} message waits for more than 10 minutes."

      - alert: MessageDeadLettered
        expr: max(memorio_messaging_dead_letters_count) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} integration event(s) failed every retry and wait in the dead letters."
          runbook_url: "https://github.com/KrystianSiupik/Memorio/blob/main/docs/runbooks/dead-letters.md"

      # Without the backlog metric QS12 cannot be checked at all: the worker is down or not exporting.
      - alert: MessagingMetricsMissing
        expr: absent(memorio_messaging_pending_oldest_age_seconds)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The worker sends no message backlog metric."

  - name: scheduling
    rules:
      - alert: ScheduledJobGivenUp
        expr: sum by (scheduled_job, outcome) (increase(memorio_scheduling_runs_total{outcome=~"given_up|unknown"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.scheduled_job }}: a firing ended as {{ $labels.outcome }}."

  # Connections (PLAT-21, D-182): the server's slots, from deploy/backup/connections-status.sh, and the pools
  # of the hosts, from Npgsql's meter (one pool per role and process, D-181).
  - name: database
    rules:
      - alert: DatabaseConnectionsHigh
        expr: sum(memorio_postgres_connections) / max(memorio_postgres_max_connections) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "The database server uses more than 80% of max_connections: soon it refuses new connections (53300)."

      - alert: ConnectionPoolExhausted
        expr: sum by (job, db_client_connection_pool_name) (increase(db_client_connection_npgsql_timeouts_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }}: the pool {{ $labels.db_client_connection_pool_name }} was used up; requests waited for a connection until the timeout."
